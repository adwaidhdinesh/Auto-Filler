<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Form Scanner</title>
<style>
  :root {
    --ink: #1c2321;
    --paper: #fafaf8;
    --line: #dcdcd6;
    --accent: #3a6b5c;
    --accent-dim: #e4ede9;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }
  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0;
    font-size: 11.5px;
    color: #6b7570;
  }
  main {
    padding: 12px 16px 16px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  button {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: white;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button:active { transform: translateY(1px); }
  #count {
    font-size: 11.5px;
    color: var(--accent);
    font-weight: 600;
    margin-left: auto;
    align-self: center;
  }
  #output {
    width: 100%;
    height: 280px;
    resize: vertical;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: white;
    color: var(--ink);
    white-space: pre;
    overflow: auto;
  }
  .hint {
    margin-top: 8px;
    font-size: 11px;
    color: #8a938e;
  }
</style>
</head>
<body>
  <header>
    <h1>Form Scanner</h1>
    <p>Phase 1 &mdash; detection only. No AI, no autofill.</p>
  </header>
  <main>
    <div class="row">
      <button id="scanBtn" class="primary">Scan form</button>
      <button id="copyBtn">Copy JSON</button>
      <span id="count"></span>
    </div>
    <textarea id="output" readonly placeholder="Open a Google Form, then click Scan form."></textarea>
    <div class="hint">Runs only on docs.google.com/forms pages.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
